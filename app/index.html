<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Desk</title>
<!-- Placeholder from S1. S2 replaces this with the study ported from prototype/. -->
<style>
  :root{--deeper:#0f2221;--cream:#fbf4e4;--amber:#f2b84b;--leaf:#6e9a3a;color-scheme:dark}
  html,body{height:100%;margin:0}
  body{display:grid;place-items:center;background:radial-gradient(ellipse at center,#1f3a37 0%,var(--deeper) 70%);color:var(--cream);font:16px/1.55 system-ui,sans-serif;text-align:center;padding:24px;box-sizing:border-box}
  .lamp{width:14px;height:14px;margin:0 auto 18px;border-radius:50%;background:var(--amber);box-shadow:0 0 40px 14px rgba(242,184,75,.35)}
  h1{margin:0 0 6px;font-size:28px;font-weight:600;letter-spacing:.01em}
  p{margin:0;opacity:.8}
  .leaf{color:var(--leaf)}
</style>
</head>
<body>
  <main>
    <div class="lamp" aria-hidden="true"></div>
    <h1>The Desk</h1>
    <p>The study is being moved in. The lamp is on<span class="leaf">.</span></p>
  </main>
</body>
</html>
